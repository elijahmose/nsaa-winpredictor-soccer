<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NEST Computer Matchup Predictor</title>
  <style>
    :root {
      --bg: #f2efe5;
      --panel: #fffdfa;
      --ink: #12211c;
      --muted: #5d6d67;
      --line: #ddd5c8;
      --accent: #166b44;
      --accent-soft: #d7ecdf;
      --accent-2: #bd8a21;
      --warn: #a53a2d;
      --gold-soft: #f3e7c7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
      background:
        radial-gradient(circle at top left, rgba(22,107,68,.12), transparent 30%),
        radial-gradient(circle at bottom right, rgba(189,138,33,.16), transparent 25%),
        var(--bg);
      color: var(--ink);
    }
    .wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: 32px 20px 56px;
    }
    .hero {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 4vw, 3.8rem);
      line-height: 1;
      letter-spacing: -.03em;
    }
    .brand-chip {
      border: 1px solid var(--line);
      background: rgba(255,255,255,.76);
      border-radius: 999px;
      padding: 10px 14px;
      font-size: .8rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      white-space: nowrap;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 18px 45px rgba(20,34,28,.08);
    }
    .tabs {
      display: inline-flex;
      gap: 8px;
      background: #efe8da;
      padding: 6px;
      border-radius: 999px;
      margin-bottom: 18px;
    }
    .tab {
      border: 0;
      border-radius: 999px;
      padding: 10px 14px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      cursor: pointer;
    }
    .tab.active {
      background: white;
      color: var(--ink);
      box-shadow: 0 2px 10px rgba(20,34,28,.08);
      font-weight: 700;
    }
    .mode-panel { display: none; }
    .mode-panel.active { display: block; }
    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 16px;
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    select,
    input[type="text"] {
      width: 100%;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: white;
      padding: 12px 14px;
      font-size: 1rem;
      color: var(--ink);
    }
    .combo {
      position: relative;
    }
    .combo-menu {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: white;
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 16px 32px rgba(20,34,28,.12);
      overflow: hidden;
      z-index: 20;
      max-height: 280px;
      overflow-y: auto;
      display: none;
    }
    .combo-menu.open {
      display: block;
    }
    .combo-item,
    .combo-empty {
      width: 100%;
      border: 0;
      background: white;
      text-align: left;
      font: inherit;
      color: var(--ink);
      padding: 11px 14px;
    }
    .combo-item {
      cursor: pointer;
      border-bottom: 1px solid #f1ebde;
    }
    .combo-item:last-child {
      border-bottom: 0;
    }
    .combo-item:hover,
    .combo-item.active {
      background: var(--accent-soft);
    }
    .combo-empty {
      color: var(--muted);
      font-size: .92rem;
    }
    .combo-meta {
      display: block;
      color: var(--muted);
      font-size: .84rem;
      margin-top: 3px;
    }
    .actions {
      display: flex;
      gap: 12px;
      align-items: center;
      margin: 8px 0 18px;
      flex-wrap: wrap;
    }
    .btn {
      border: 1px solid var(--line);
      background: white;
      border-radius: 999px;
      padding: 10px 16px;
      cursor: pointer;
      font: inherit;
      color: var(--ink);
    }
    .result {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 14px;
      align-items: center;
      margin: 18px 0 8px;
    }
    .team-card {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      background: linear-gradient(180deg, rgba(22,107,68,.05), rgba(255,255,255,.9));
    }
    .team-name {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .team-meta {
      color: var(--muted);
      font-size: .95rem;
    }
    .prob {
      text-align: center;
      min-width: 170px;
    }
    .prob-num {
      font-size: clamp(2rem, 5vw, 3.4rem);
      font-weight: 700;
      line-height: 1;
      color: var(--accent);
    }
    .prob-label {
      color: var(--muted);
      margin-top: 6px;
      font-size: .95rem;
    }
    .prob-odds {
      margin-top: 10px;
      font-size: 1rem;
      font-weight: 700;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin-top: 18px;
    }
    .stat {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      background: white;
    }
    .stat-k {
      color: var(--muted);
      font-size: .78rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: 8px;
    }
    .stat-v {
      font-size: 1.18rem;
      font-weight: 700;
    }
    .bar {
      margin-top: 20px;
      height: 18px;
      border-radius: 999px;
      overflow: hidden;
      background: #e7e1d4;
      display: flex;
    }
    .bar-a { background: linear-gradient(90deg, var(--accent), #2ca868); }
    .bar-b { background: linear-gradient(90deg, var(--accent-2), #d8b661); }
    .note {
      margin-top: 16px;
      color: var(--muted);
      font-size: .95rem;
    }
    .warn {
      margin-top: 12px;
      color: var(--warn);
      font-size: .95rem;
      font-weight: 700;
    }
    .compare-list {
      display: grid;
      gap: 10px;
      margin-top: 18px;
    }
    .compare-row {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 16px;
      background: white;
      display: grid;
      grid-template-columns: 1.5fr .85fr .85fr auto;
      gap: 12px;
      align-items: center;
    }
    .compare-title {
      font-weight: 700;
      font-size: 1.05rem;
    }
    .compare-meta {
      color: var(--muted);
      font-size: .9rem;
      margin-top: 4px;
    }
    .pill {
      display: inline-block;
      border-radius: 999px;
      padding: 6px 10px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: .82rem;
      font-weight: 700;
    }
    .soft-pill {
      display: inline-block;
      border-radius: 999px;
      padding: 6px 10px;
      background: var(--gold-soft);
      color: #835e0f;
      font-size: .82rem;
      font-weight: 700;
    }
    @media (max-width: 760px) {
      .hero { display: block; }
      .brand-chip { margin-top: 10px; display: inline-block; }
      .result { grid-template-columns: 1fr; }
      .prob { order: -1; }
      .compare-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <h1>NEST Computer Matchup Predictor</h1>
    </div>
    <div class="panel">
      <div class="tabs">
        <button class="tab active" data-mode="matchup">Matchup Mode</button>
        <button class="tab" data-mode="comparison">Comparison Mode</button>
      </div>

      <section id="matchupPanel" class="mode-panel active">
        <div class="controls">
          <div>
            <label for="sportFilter">Sport Pool</label>
            <select id="sportFilter"></select>
          </div>
          <div>
            <label for="classFilter">Class Filter</label>
            <select id="classFilter"></select>
          </div>
          <div>
            <label for="teamAInput">Team A</label>
            <div class="combo">
              <input id="teamAInput" type="text" autocomplete="off" placeholder="Type a team name">
              <div id="teamOptionsA" class="combo-menu"></div>
            </div>
          </div>
          <div>
            <label for="teamBInput">Team B</label>
            <div class="combo">
              <input id="teamBInput" type="text" autocomplete="off" placeholder="Type a team name">
              <div id="teamOptionsB" class="combo-menu"></div>
            </div>
          </div>
          <div>
            <label for="location">Location</label>
            <select id="location">
              <option value="neutral">Neutral Site</option>
              <option value="homeA">Team A Home</option>
              <option value="homeB">Team B Home</option>
            </select>
          </div>
        </div>
        <div class="actions">
          <button class="btn" id="swapTeams">Swap Teams</button>
        </div>
        <div class="warn" id="matchupWarning"></div>
        <div class="result">
          <div class="team-card">
            <div class="team-name" id="nameA"></div>
            <div class="team-meta" id="metaA"></div>
          </div>
          <div class="prob">
            <div class="prob-num" id="probA"></div>
            <div class="prob-label">chance Team A wins</div>
            <div class="prob-odds" id="oddsA"></div>
          </div>
          <div class="team-card">
            <div class="team-name" id="nameB"></div>
            <div class="team-meta" id="metaB"></div>
          </div>
        </div>
        <div class="bar">
          <div class="bar-a" id="barA"></div>
          <div class="bar-b" id="barB"></div>
        </div>
        <div class="stats-grid">
          <div class="stat">
            <div class="stat-k">Team B Win Chance</div>
            <div class="stat-v" id="probB"></div>
          </div>
          <div class="stat">
            <div class="stat-k">Team B Odds</div>
            <div class="stat-v" id="oddsB"></div>
          </div>
          <div class="stat">
            <div class="stat-k">Rating Gap</div>
            <div class="stat-v" id="ratingGap"></div>
          </div>
          <div class="stat">
            <div class="stat-k">Expected Margin</div>
            <div class="stat-v" id="expectedMargin"></div>
          </div>
          <div class="stat">
            <div class="stat-k">Projected Score</div>
            <div class="stat-v" id="likelyScore"></div>
          </div>
          <div class="stat">
            <div class="stat-k">Other Likely Scores</div>
            <div class="stat-v" id="topOutcomes"></div>
          </div>
        </div>
        <p class="note" id="note"></p>
      </section>

      <section id="comparisonPanel" class="mode-panel">
        <div class="controls">
          <div>
            <label for="comparisonInput">Base Team</label>
            <div class="combo">
              <input id="comparisonInput" type="text" autocomplete="off" placeholder="Type a team name">
              <div id="comparisonOptions" class="combo-menu"></div>
            </div>
          </div>
        </div>
        <div class="compare-list" id="comparisonResults"></div>
      </section>
    </div>
  </div>

      const normalized = query.trim().toLowerCase();
      const ranked = filtered
        .map((team) => {
          const label = optionLabel(team);
          const haystack = `${team.team} ${team.segment} ${team.class_code}`.toLowerCase();
          const startsWith = normalized && team.team.toLowerCase().startsWith(normalized) ? 0 : 1;
          const contains = normalized && haystack.includes(normalized) ? 0 : 1;
          return { team, label, startsWith, contains };
        })
        .filter((entry) => !normalized || entry.contains === 0)
        .sort((a, b) =>

          a.contains - b.contains ||
          a.team.rank - b.team.rank ||
          a.team.team.localeCompare(b.team.team)

        .slice(0, 10);
      if (!ranked.length) {
        target.innerHTML = '<div class="combo-empty">No matching teams</div>';

        ((teamA.power_rating - teamB.power_rating) * 0.55) +

    function buildPoolProfiles() {
      const grouped = new Map();
      sortedTeams.forEach((team) => {
        const key = poolKey(team);
        if (!grouped.has(key)) grouped.set(key, []);
        grouped.get(key).push(team);
      });
      const profiles = new Map();
      grouped.forEach((pool, key) => {
        const avgScored = pool.reduce((sum, team) => sum + team.average_goals_scored, 0) / pool.length;
        const avgAllowed = pool.reduce((sum, team) => sum + team.average_goals_allowed, 0) / pool.length;
        const scores = pool.map((team) => team.score);
        profiles.set(key, {
          avgScored,
          avgAllowed,
          paritySpread: quantile(scores, 0.9) - quantile(scores, 0.1),
          normalCap: Math.min(4.4, Math.max(3.2, avgScored * 1.3 + 0.9)),
          mercyCap: Math.min(10.0, Math.max(7.5, avgScored * 2.2 + 3.1)),
        });
      });
      return profiles;
    }

    function matchupProfile(teamA, teamB) {
      const profileA = poolProfiles.get(poolKey(teamA));
      const profileB = poolProfiles.get(poolKey(teamB));
      if (!profileA && !profileB) {
        return { avgScored: 2.0, avgAllowed: 2.0, paritySpread: 70, normalCap: 4.0, mercyCap: 9.0 };
      }
      if (!profileA) return profileB;
      if (!profileB) return profileA;
      return {
        avgScored: (profileA.avgScored + profileB.avgScored) / 2,
        avgAllowed: (profileA.avgAllowed + profileB.avgAllowed) / 2,
        paritySpread: (profileA.paritySpread + profileB.paritySpread) / 2,
        normalCap: (profileA.normalCap + profileB.normalCap) / 2,
        mercyCap: Math.max(profileA.mercyCap, profileB.mercyCap),
      };
    }

    function shrinkRate(value, baseline, gamesPlayed) {
      const sampleWeight = Math.min(0.78, Math.max(0.25, gamesPlayed / 18));
      return (value * sampleWeight) + (baseline * (1 - sampleWeight));
    }

    function winProb(teamA, teamB, location) {
      const gap = computeGap(teamA, teamB, location);
      const raw = 1 / (1 + Math.exp(-(gap / 2.15)));
      const tempered = 0.5 + ((raw - 0.5) * 0.86);
      return Math.max(0.01, Math.min(0.99, tempered));
    }

    function toAmericanOdds(prob) {
      if (prob <= 0) return "+9999";
      if (prob >= 1) return "-9999";
      if (Math.abs(prob - 0.5) < 0.0001) return "+100";
      if (prob > 0.5) return `${Math.round(-(prob / (1 - prob)) * 100)}`;
      return `+${Math.round(((1 - prob) / prob) * 100)}`;
    }

    function matchupTier({ favoriteProb, scoreGap, favoriteAttack, favoriteDefense, underdogAttack, underdogDefense, profile }) {
      const hardMercy =
        (favoriteProb >= 0.992 && scoreGap >= 90) ||
        (favoriteProb >= 0.985 && scoreGap >= 78 && favoriteAttack >= 2.8 && underdogAttack <= 0.8 && underdogDefense >= 4.5) ||
        (favoriteProb >= 0.975 && scoreGap >= 65 && favoriteDefense <= 0.5 && underdogAttack <= 0.35 && underdogDefense >= 5.5);
      if (hardMercy) {
        return { name: "hard_mercy", minMargin: 8.5, maxMargin: 10.0, underdogCap: 0.25, favoriteBoost: 2.2, mercy: true };
      }
      if (favoriteProb >= 0.95 && scoreGap >= 50) {
        return { name: "mercy_watch", minMargin: 5.0, maxMargin: 7.4, underdogCap: 0.45, favoriteBoost: 1.0, mercy: false };
      }
      if (favoriteProb >= 0.87) {
        return { name: "clear_gap", minMargin: 3.2, maxMargin: Math.min(5.8, profile.normalCap + 1.2), underdogCap: 1.0, favoriteBoost: 0.8, mercy: false };
      }
      if (favoriteProb >= 0.73) {
        return { name: "solid_edge", minMargin: 1.7, maxMargin: 3.7, underdogCap: 1.8, favoriteBoost: 0.15, mercy: false };
      }
      if (favoriteProb >= 0.6) {
        return { name: "small_edge", minMargin: 0.8, maxMargin: 2.2, underdogCap: 2.4, favoriteBoost: 0.0, mercy: false };
      }
      return { name: "tossup", minMargin: 0.2, maxMargin: 1.2, underdogCap: 3.0, favoriteBoost: 0.0, mercy: false };
    }

    function expectedGoals(teamA, teamB, probabilityA, gap) {
      const scoreGap = Math.abs(teamA.score - teamB.score);
      const profile = matchupProfile(teamA, teamB);
      const favoriteIsA = probabilityA >= 0.5;
      const favoriteProb = Math.max(probabilityA, 1 - probabilityA);
      const teamAAttack = shrinkRate(teamA.average_goals_scored, profile.avgScored, teamA.games_played);
      const teamBAttack = shrinkRate(teamB.average_goals_scored, profile.avgScored, teamB.games_played);
      const teamADefense = shrinkRate(teamA.average_goals_allowed, profile.avgAllowed, teamA.games_played);
      const teamBDefense = shrinkRate(teamB.average_goals_allowed, profile.avgAllowed, teamB.games_played);
      const baseA = Math.max(0.18, (teamAAttack * 0.6) + (teamBDefense * 0.4));
      const baseB = Math.max(0.18, (teamBAttack * 0.6) + (teamADefense * 0.4));
      const totalBase = Math.max(1.6, Math.min(profile.avgScored * 2.7, baseA + baseB));
      const parityFactor = Math.max(0.88, Math.min(1.12, profile.paritySpread / 72));
      let targetMargin = ((favoriteProb - 0.5) * 3.3 * parityFactor) + (Math.log1p(scoreGap / 22) * 0.9);
      targetMargin = Math.max(0.2, Math.min(profile.normalCap, targetMargin));

      const favoriteTeam = favoriteIsA ? teamA : teamB;
      const underdogTeam = favoriteIsA ? teamB : teamA;
      const series = directSeries(favoriteTeam, underdogTeam);
      const favoriteAttack = favoriteTeam.average_goals_scored;
      const favoriteDefense = favoriteTeam.average_goals_allowed;
      const underdogAttack = underdogTeam.average_goals_scored;
      const underdogDefense = underdogTeam.average_goals_allowed;
      const underdogShutoutRisk =
        underdogAttack <= Math.max(0.2, profile.avgScored * 0.1) ||
        underdogAttack <= 0.35;
      const favoriteRunway =
        favoriteAttack >= Math.max(profile.avgScored * 1.25, 2.8) ||
        favoriteTeam.win_pct >= 85;
      const tier = matchupTier({
        favoriteProb,
        scoreGap,
        favoriteAttack,
        favoriteDefense,
        underdogAttack,
        underdogDefense,
        profile,
      });
      if (favoriteProb >= 0.94 && scoreGap >= 28 && favoriteAttack >= 2.6 && underdogDefense >= 1.2) {
        tier.minMargin = Math.max(tier.minMargin, 3.8);
        tier.maxMargin = Math.max(tier.maxMargin, 5.9);
        tier.underdogCap = Math.min(tier.underdogCap, 0.85);
      }
      if (favoriteTeam.class_code !== underdogTeam.class_code && favoriteProb >= 0.88 && scoreGap >= 22) {
        tier.minMargin = Math.max(tier.minMargin, 3.5);
        tier.maxMargin = Math.max(tier.maxMargin, 5.6);
      }

      if (series && favoriteTeam.class_code === underdogTeam.class_code) {
        const favoriteSeriesMargin = series.goal_margin_sum / Math.max(1, series.games);
        const favoriteSeriesAgainst = series.goals_against_sum / Math.max(1, series.games);
        if (favoriteSeriesMargin >= 4 && favoriteSeriesAgainst <= 1) {
          tier.minMargin = Math.max(tier.minMargin, 3.8);
          tier.maxMargin = Math.max(tier.maxMargin, 5.8);
          tier.underdogCap = Math.min(tier.underdogCap, 0.9);
        }
        if (favoriteSeriesMargin >= 5 && favoriteSeriesAgainst === 0) {
          tier.minMargin = Math.max(tier.minMargin, 4.8);
          tier.maxMargin = Math.max(tier.maxMargin, 6.6);
          tier.underdogCap = Math.min(tier.underdogCap, 0.4);
        }
      }

      targetMargin = Math.max(tier.minMargin, Math.min(tier.maxMargin, targetMargin));
      if (!tier.mercy && favoriteProb >= 0.91 && favoriteAttack >= Math.max(profile.avgScored * 1.15, 2.4) && underdogDefense >= Math.max(profile.avgAllowed * 1.7, 3.2)) {
        targetMargin = Math.min(tier.maxMargin, targetMargin + 0.45);
      }

      let favoriteGoals = (totalBase + targetMargin) / 2;
      let underdogGoals = Math.max(0.05, totalBase - favoriteGoals);
      if (favoriteProb >= 0.72) underdogGoals *= 0.92;
      if (favoriteProb <= 0.82) {
        underdogGoals = Math.max(0.6, underdogGoals);
      } else if (favoriteProb <= 0.92) {
        underdogGoals = Math.max(0.35, underdogGoals);
      }
      if (underdogShutoutRisk) {
        underdogGoals = Math.min(underdogGoals, tier.underdogCap);
      }
      if (favoriteRunway && underdogDefense >= Math.max(profile.avgAllowed * 1.7, 3.2)) {
        favoriteGoals += 0.35 + tier.favoriteBoost;
      }
      if (tier.mercy) {
        favoriteGoals += 1.0;
      }

      favoriteGoals = Math.max(1.0, favoriteGoals);
      if (tier.mercy) {
        favoriteGoals = Math.min(10.5, favoriteGoals);
        underdogGoals = Math.min(tier.underdogCap, underdogGoals);
      } else {
        favoriteGoals = Math.min(tier.name === "mercy_watch" ? 8.2 : 6.2, favoriteGoals);
        underdogGoals = Math.min(tier.underdogCap, underdogGoals);
      }
      if (favoriteProb >= 0.93 && favoriteTeam.class_code !== underdogTeam.class_code) {
        favoriteGoals = Math.max(favoriteGoals, 4.0);
      }

      if (series && favoriteTeam.class_code === underdogTeam.class_code) {
        const observedFavoriteGoals = series.goals_for_sum / Math.max(1, series.games);
        const observedUnderdogGoals = series.goals_against_sum / Math.max(1, series.games);
        const emphaticSeries = Math.abs(series.goal_margin_sum / Math.max(1, series.games)) >= 3;
        const blend = emphaticSeries ? Math.min(0.42, 0.24 + (series.games * 0.08)) : Math.min(0.18, 0.08 + (series.games * 0.04));
        favoriteGoals = (favoriteGoals * (1 - blend)) + (observedFavoriteGoals * blend);
        underdogGoals = (underdogGoals * (1 - blend)) + (observedUnderdogGoals * blend);
      }

      return favoriteIsA
        ? { teamA: favoriteGoals, teamB: underdogGoals, mercy: tier.mercy, tier: tier.name }
        : { teamA: underdogGoals, teamB: favoriteGoals, mercy: tier.mercy, tier: tier.name };
    }

    function poissonProb(k, lambda) {
      let factorial = 1;
      for (let i = 2; i <= k; i += 1) factorial *= i;
      return Math.exp(-lambda) * (lambda ** k) / factorial;
    }

    function scoreDistribution(teamA, teamB, location) {
      const pA = winProb(teamA, teamB, location);
      const gap = computeGap(teamA, teamB, location);
      const exp = expectedGoals(teamA, teamB, pA, gap);
      const outcomes = [];
      for (let a = 0; a <= 12; a += 1) {
        for (let b = 0; b <= 12; b += 1) {
          outcomes.push({
            score: `${a}-${b}`,
            probability: poissonProb(a, exp.teamA) * poissonProb(b, exp.teamB),
          });
        }
      }
      outcomes.sort((left, right) => right.probability - left.probability);
      return { probabilityA: pA, expected: exp, outcomes };
    }

    function projectedScore(dist) {
      if (dist.expected.mercy) {
        return dist.expected.teamA >= dist.expected.teamB ? "10-0" : "0-10";
      }
      if (dist.expected.tier === "mercy_watch") {
        const favoriteA = dist.expected.teamA >= dist.expected.teamB;
        const fav = Math.max(6, Math.round(Math.max(dist.expected.teamA, dist.expected.teamB)));
        const dog = Math.min(1, Math.round(Math.min(dist.expected.teamA, dist.expected.teamB)));
        return favoriteA ? `${fav}-${dog}` : `${dog}-${fav}`;
      }
      const a = Math.max(0, Math.round(dist.expected.teamA));
      const b = Math.max(0, Math.round(dist.expected.teamB));
      if (a === b) {
        return dist.outcomes[0]?.score || `${a}-${b}`;
      }
      return `${a}-${b}`;
    }

    function topOutcomesText(dist) {
      return dist.outcomes
        .slice(0, 3)
        .map((entry) => `${entry.score} (${(entry.probability * 100).toFixed(0)}%)`)
        .join(" | ");
    }

    function renderTeamInputs() {
      const pool = matchupPool();
      fillMenu(els.teamOptionsA, pool, "", els.teamAInput.value);
      const teamBPool = fillMenu(els.teamOptionsB, pool, "", els.teamBInput.value);
      safeResolve(els.teamBInput, teamBPool);
    }

    function renderMatchup() {
      const pool = matchupPool();
      const teamA = safeResolve(els.teamAInput, pool);
      const teamBPool = pool;
      const teamB = safeResolve(els.teamBInput, teamBPool);
      if (!teamA || !teamB) return;

      els.warning.textContent = teamA.sport_group !== teamB.sport_group
        ? "Cross-pool matchup enabled. Treat these as model-based comparisons rather than literal same-division odds."
        : "";

      const dist = scoreDistribution(teamA, teamB, els.location.value);
      const probabilityA = dist.probabilityA;
      const probabilityB = 1 - probabilityA;
      const ratingGap = teamA.score - teamB.score;
      const expectedMargin = dist.expected.teamA - dist.expected.teamB;

      els.nameA.textContent = teamA.team;
      els.nameB.textContent = teamB.team;
      els.metaA.textContent = `${teamA.segment} | Rank #${teamA.rank} | Record ${teamA.wins}-${teamA.losses}`;
      els.metaB.textContent = `${teamB.segment} | Rank #${teamB.rank} | Record ${teamB.wins}-${teamB.losses}`;
      els.probA.textContent = `${(probabilityA * 100).toFixed(1)}%`;
      els.probB.textContent = `${(probabilityB * 100).toFixed(1)}%`;
      els.oddsA.textContent = toAmericanOdds(probabilityA);
      els.oddsB.textContent = toAmericanOdds(probabilityB);
      els.ratingGap.textContent = `${ratingGap >= 0 ? "+" : ""}${ratingGap.toFixed(2)}`;
      els.expectedMargin.textContent = `${expectedMargin >= 0 ? "+" : ""}${expectedMargin.toFixed(2)} goals`;
      els.likelyScore.textContent = projectedScore(dist);
      els.topOutcomes.textContent = topOutcomesText(dist);
      els.barA.style.width = `${(probabilityA * 100).toFixed(1)}%`;
      els.barB.style.width = `${(probabilityB * 100).toFixed(1)}%`;
      els.note.textContent = dist.expected.mercy
        ? "Mercy-rule type projection. NEST is treating this as a major mismatch."
        : `Power edge: ${teamA.power_rating >= teamB.power_rating ? teamA.team : teamB.team} | Location: ${els.location.options[els.location.selectedIndex].text}`;
    }

    function renderComparisons() {
      const baseTeam = teamByLabel.get(els.comparisonInput.value.trim()) || sortedTeams[0];
      if (!teamByLabel.get(els.comparisonInput.value.trim())) {
        els.comparisonInput.value = optionLabel(baseTeam);
      }
      const results = sortedTeams
        .filter((team) => team !== baseTeam)
        .map((team) => {
          const diff = comparisonScore(baseTeam, team);
          return { team, diff, similarity: similarityPercent(diff) };
        })
        .sort((a, b) => a.diff - b.diff)
        .slice(0, 10);

      els.comparisonResults.innerHTML = results.map((entry) => `
        <div class="compare-row">
          <div>
            <div class="compare-title">${entry.team.team}</div>
            <div class="compare-meta">${entry.team.segment} | Rank #${entry.team.rank} | Score ${entry.team.score}</div>
          </div>
          <div><span class="pill">${entry.similarity}% similarity</span></div>
          <div><span class="soft-pill">diff ${entry.diff.toFixed(3)}</span></div>
          <div>${entry.team.sport_group === baseTeam.sport_group ? `<button class="btn compare-jump" data-target="${optionLabel(entry.team)}" data-base="${optionLabel(baseTeam)}">Load Matchup</button>` : ""}</div>
        </div>
      `).join("");

      els.comparisonResults.querySelectorAll(".compare-jump").forEach((button) => {
        button.addEventListener("click", () => {
          document.querySelector('[data-mode="matchup"]').click();
          const base = teamByLabel.get(button.dataset.base);
          els.sportFilter.value = base.sport_group;
          els.classFilter.value = "";
          renderTeamInputs();
          els.teamAInput.value = button.dataset.base;
          renderTeamInputs();
          els.teamBInput.value = button.dataset.target;
          renderMatchup();
        });
      });
    }

    document.querySelectorAll(".tab").forEach((button) => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach((tab) => tab.classList.remove("active"));
        button.classList.add("active");
        const isMatchup = button.dataset.mode === "matchup";
        els.matchupPanel.classList.toggle("active", isMatchup);
        els.comparisonPanel.classList.toggle("active", !isMatchup);
      });
    });

    populateFilters();
    els.comparisonInput.value = optionLabel(sortedTeams[0]);
    fillMenu(els.comparisonOptions, sortedTeams, "", els.comparisonInput.value);
    renderTeamInputs();
    if (els.teamAInput.value === els.teamBInput.value && sortedTeams[1]) {
      els.teamBInput.value = optionLabel(sortedTeams[1]);
    }
    renderMatchup();
    renderComparisons();

    [els.sportFilter, els.classFilter].forEach((control) => control.addEventListener("change", () => {
      renderTeamInputs();
      renderMatchup();
    }));
    [els.teamAInput, els.teamBInput, els.location].forEach((control) => control.addEventListener("change", renderMatchup));
    els.swapTeams.addEventListener("click", () => {
      const temp = els.teamAInput.value;
      els.teamAInput.value = els.teamBInput.value;
      els.teamBInput.value = temp;
      renderTeamInputs();
      renderMatchup();
    });
    els.comparisonInput.addEventListener("change", renderComparisons);

    function wireCombo(input, menu, getContext, onPick) {
      function refreshMenu() {
        const context = getContext();
        fillMenu(menu, context.pool, context.restrictSportGroup || "", input.value);
        menu.classList.add("open");
        menu.querySelectorAll(".combo-item").forEach((button) => {
          button.addEventListener("mousedown", (event) => {
            event.preventDefault();
            input.value = button.dataset.label;
            menu.classList.remove("open");
            onPick();
          });
        });
      }
      input.addEventListener("focus", refreshMenu);
      input.addEventListener("input", refreshMenu);
      input.addEventListener("keydown", (event) => {
        if (event.key === "Escape") menu.classList.remove("open");
      });
      input.addEventListener("blur", () => {
        window.setTimeout(() => menu.classList.remove("open"), 120);
      });
    }

    wireCombo(els.teamAInput, els.teamOptionsA, () => ({ pool: matchupPool() }), () => {
      renderTeamInputs();
      renderMatchup();
    });
    wireCombo(els.teamBInput, els.teamOptionsB, () => {
      const pool = matchupPool();
      return { pool, restrictSportGroup: "" };
    }, renderMatchup);
    wireCombo(els.comparisonInput, els.comparisonOptions, () => ({ pool: sortedTeams }), renderComparisons);
  </script>
</body>
</html>

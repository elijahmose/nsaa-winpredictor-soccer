<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MRI Matchup Simulator</title>
  <style>
    :root {
      --bg: #f4f1e8;
      --panel: #fffdf8;
      --ink: #14221c;
      --muted: #5f6b63;
      --line: #d8d1c2;
      --accent: #1e7a4d;
      --accent-2: #c6972f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
      background:
        radial-gradient(circle at top left, rgba(30,122,77,.13), transparent 28%),
        radial-gradient(circle at bottom right, rgba(198,151,47,.16), transparent 24%),
        var(--bg);
      color: var(--ink);
    }
    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 40px 20px 56px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 3vw, 3.1rem);
      line-height: 1;
      letter-spacing: -.03em;
    }
    .sub {
      color: var(--muted);
      max-width: 720px;
      margin-bottom: 28px;
      font-size: 1rem;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 18px 45px rgba(20,34,28,.08);
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    select {
      width: 100%;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: white;
      padding: 12px 14px;
      font-size: 1rem;
      color: var(--ink);
    }
    .result {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 14px;
      align-items: center;
      margin: 18px 0 8px;
    }
    .team-card {
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      background: linear-gradient(180deg, rgba(30,122,77,.05), rgba(255,255,255,.9));
    }
    .team-name {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .team-meta {
      color: var(--muted);
      font-size: .95rem;
    }
    .prob {
      text-align: center;
      min-width: 150px;
    }
    .prob-num {
      font-size: clamp(2rem, 5vw, 3.4rem);
      font-weight: 700;
      line-height: 1;
      color: var(--accent);
    }
    .prob-label {
      color: var(--muted);
      margin-top: 6px;
      font-size: .95rem;
    }
    .bar {
      margin-top: 20px;
      height: 18px;
      border-radius: 999px;
      overflow: hidden;
      background: #e7e1d4;
      display: flex;
    }
    .bar-a {
      background: linear-gradient(90deg, var(--accent), #2ca868);
    }
    .bar-b {
      background: linear-gradient(90deg, var(--accent-2), #d8b661);
    }
    .note {
      margin-top: 16px;
      color: var(--muted);
      font-size: .95rem;
    }
    @media (max-width: 760px) {
      .result { grid-template-columns: 1fr; }
      .prob { order: -1; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>MRI Matchup Simulator</h1>
    <p class="sub">Pick two teams from the same sport pool to estimate a neutral-site win probability based on the model's internal ratings. This is a projection tool, not a guarantee.</p>
    <div class="panel">
      <div class="controls">
        <div>
          <label for="teamA">Team A</label>
          <select id="teamA"></select>
        </div>
        <div>
          <label for="teamB">Team B</label>
          <select id="teamB"></select>
        </div>
      </div>
      <div class="result">
        <div class="team-card">
          <div class="team-name" id="nameA"></div>
          <div class="team-meta" id="metaA"></div>
        </div>
        <div class="prob">
          <div class="prob-num" id="probA"></div>
          <div class="prob-label">chance Team A wins</div>
        </div>
        <div class="team-card">
          <div class="team-name" id="nameB"></div>
          <div class="team-meta" id="metaB"></div>
        </div>
      </div>
      <div class="bar">
        <div class="bar-a" id="barA"></div>
        <div class="bar-b" id="barB"></div>
      </div>
      <p class="note" id="note"></p>
    </div>
  </div>

    const teamASelect = document.getElementById("teamA");
    const teamBSelect = document.getElementById("teamB");
    const byLabel = [...teams].sort((a, b) => (a.sport_group + a.class_code + a.team).localeCompare(b.sport_group + b.class_code + b.team));

    function optionLabel(team) {
      return `${team.team} | ${team.sport_group.replaceAll("_", " ")} | Class ${team.class_code}`;
    }

    function populate(select) {
      byLabel.forEach((team, index) => {
        const option = document.createElement("option");
        option.value = index;
        option.textContent = optionLabel(team);
        select.appendChild(option);
      });
    }

    function winProb(teamA, teamB) {
      const blendedGap = ((teamA.result_rating - teamB.result_rating) * 0.72) + ((teamA.margin_rating - teamB.margin_rating) * 0.28);
      return 1 / (1 + Math.exp(-(blendedGap / 1.25)));
    }

    function render() {
      const teamA = byLabel[Number(teamASelect.value)];
      const teamB = byLabel[Number(teamBSelect.value)];
      if (!teamA || !teamB) return;
      const pA = winProb(teamA, teamB);
      const pB = 1 - pA;
      document.getElementById("nameA").textContent = teamA.team;
      document.getElementById("nameB").textContent = teamB.team;
      document.getElementById("metaA").textContent = `Rank #${teamA.rank} | Score ${teamA.score} | Class ${teamA.class_code}`;
      document.getElementById("metaB").textContent = `Rank #${teamB.rank} | Score ${teamB.score} | Class ${teamB.class_code}`;
      document.getElementById("probA").textContent = `${(pA * 100).toFixed(1)}%`;
      document.getElementById("barA").style.width = `${(pA * 100).toFixed(1)}%`;
      document.getElementById("barB").style.width = `${(pB * 100).toFixed(1)}%`;
      document.getElementById("note").textContent = `Estimated Team B win chance: ${(pB * 100).toFixed(1)}%. Best used within the same sport group.`;
    }

    populate(teamASelect);
    populate(teamBSelect);
    teamASelect.selectedIndex = 0;
    teamBSelect.selectedIndex = Math.min(1, byLabel.length - 1);
    teamASelect.addEventListener("change", render);
    teamBSelect.addEventListener("change", render);
    render();
